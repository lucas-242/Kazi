name: kazi_core
description: "A package to handle the Kazi core"
version: 0.7.0
homepage:

environment:
  sdk: '>=3.4.3 <4.0.0'
  flutter: ">=3.32.4"

dependencies:
  equatable: ^2.0.5
  flutter:
    sdk: flutter
  flutter_masked_text2: ^0.9.1
  flutter_riverpod: ^3.0.3
  flutter_svg: ^2.0.10+1
  go_router: ^17.3.0
  http: ^1.2.2
  json_annotation: ^4.9.0
  image_picker: ^1.1.2
  in_app_review: ^2.0.11
  intl: ^0.20.2
  package_info_plus: ^8.1.0
  riverpod: ^3.0.3
  riverpod_annotation: ^3.0.3
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.1
  webview_flutter: ^4.8.0
  syncfusion_flutter_calendar: ^29.1.38

dev_dependencies:
  build_runner: ^2.7.1
  flutter_test:
    sdk: flutter
  json_serializable: ^6.8.0
  mockito: ^5.4.4
  riverpod_generator: ^3.0.3
  intl_utils: ^2.8.5

flutter:
  uses-material-design: true
  assets:
    - lib/shared/assets/svgs/
  fonts:
    - family: KaziIcons
      fonts:
        - asset: lib/shared/assets/fonts/kazi_icons.otf
    - family: Archivo
      fonts:
        - asset: lib/shared/assets/fonts/Archivo-SemiBold.ttf
          weight: 600
        - asset: lib/shared/assets/fonts/Archivo-ExtraBold.ttf
          weight: 800
    - family: IBM Plex Sans
      fonts:
        - asset: lib/shared/assets/fonts/IBMPlexSans-Regular.ttf
          weight: 400
        - asset: lib/shared/assets/fonts/IBMPlexSans-Medium.ttf
          weight: 500
    - family: IBM Plex Mono
      fonts:
        - asset: lib/shared/assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500

flutter_intl:
  enabled: true
  class_name: KaziLocalizations
  main_locale: en
  arb_dir: lib/shared/l10n/arb
  output_dir: lib/shared/l10n/generated
  use_deferred_loading: false
